[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]  # Line too long (black maneja esto)

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Imports sin usar (re-exports)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
